# Cada versão publicada na galeria é um COMMIT desta lista, identificado pelo
# SHA. O Google não lê a branch: ele lê o que está aqui.
#
# Publicar uma versão nova = fazer o commit, copiar o SHA e acrescentar uma
# entrada abaixo. Some em 2 a 3 dias na galeria. Remover uma entrada é a forma de
# despublicar uma versão que saiu com defeito — o commit continua no histórico,
# mas ninguém mais o instala.
